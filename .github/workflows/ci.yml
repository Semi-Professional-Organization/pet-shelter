name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Read-only for every job. The repository default is read-only as well, but a workflow that states
# its own permissions keeps them when that setting changes.
permissions:
  contents: read

# A new push to a pull request supersedes the run in flight on it. Playwright and the jsdom suite
# are the slow jobs, and there is no value in finishing them for a commit that has already been
# replaced. A push to main is never cancelled: every main commit is a production deploy, and while
# the default branch (then master) shared one group, 13 of 100 of its runs were cancelled by the
# next merge, leaving those deploys with no verdict. Keying main runs on the commit gives each one
# its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every tier except `integration-db` is designed to run with no database at
# all, which is also how the application behaves. Only the jobs that need
# Postgres provision it.
#
# Node comes from `.nvmrc`, the one copy every workflow reads. It names the major that Vercel
# deploys: `engines.node` in package.json is an open range, which Vercel resolves to the newest
# major it supports. See tasks/open/productions-node-version-is-documented-not-observed.md.

# Each job's `name` is a required status check in the repository ruleset "Basic" (Settings →
# Rules → Rulesets). Renaming a job blocks every pull request until the ruleset names it too.
#
# `ubuntu-24.04` rather than `ubuntu-latest`: the label moves to Ubuntu 26.04 gradually between
# 2026-10-19 and 2026-11-19 (actions/runner-images#14748), so two runs of one commit could see
# different images. Move every job deliberately, in one change.
#
# Actions are pinned to a commit, with the release as a comment. Dependabot keeps both current
# (.github/dependabot.yml).
jobs:
  static:
    name: Static & architecture analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here needs the token, and `npm ci` runs install scripts from the
          # registry. The same holds for every job in this file.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `postinstall` already runs this, but an npm cache hit can skip it and
      # leave `@prisma/client` unbuilt, which fails typecheck rather than tests.
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Layer boundaries
        run: node docs/architecture/layer-graph.mjs
      - name: Doc invariants
        run: npm run docs:check

  # The commit-message check is .github/workflows/commit-messages.yml, so that a title edit can
  # rerun it without rerunning everything here.

  # The production build, which no other job runs: typecheck and lint pass code that
  # `next build` still rejects. Vercel builds every push as well, but its status is not a
  # required check. Vercel decides whether to deploy a commit by who wrote it, so a check that
  # depended on it could stay pending forever on a pull request that Dependabot opens.
  build:
    name: Production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `next build` runs as production, where the app refuses to start without its
      # secrets. Random throwaway values satisfy that, and nothing built here is deployed.
      # With no DATABASE_URL, pages that read the database render their offline fallback.
      - name: Build
        run: |
          SESSION_SECRET="$(openssl rand -hex 32)" ADMIN_SECRET_KEY="$(openssl rand -hex 32)" \
            npm run build

  unit-and-components:
    name: Unit, integration & component tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Tiers 1-4. `test:all` deliberately excludes `integration-db`, so this
      # job needs no service container and no secret.
      - name: Unit, strict-integration and component suites
        run: npm run test:all

  database:
    name: Strict persistence against Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pet_shelter
        ports: ["5432:5432"]
        # Without this the first migration races the server's startup and fails
        # with a connection refused that looks like a broken schema.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Matches docker-compose.yml and the localhost-pinned db:*:local / test:db
      # scripts, which hardcode this password. When CI used a different one,
      # `npm run test:db` overrode DATABASE_URL with the script's value and the
      # probes failed 28P01 against a database that was running fine.
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/pet_shelter?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply the schema and seed the catalogue
        # schemaIntegrity.postgres.test.ts verifies a seed round-trip — it reads
        # the fixture pets back out and counts their updates and timeline events
        # — so an empty database fails it with "No fixture pets found" rather
        # than telling you anything about the schema.
        run: |
          npx prisma db push
          npm run db:seed
      - name: Tier 3b probes
        run: npm run test:db

  e2e:
    name: Playwright golden paths
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pet_shelter
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Matches docker-compose.yml and the localhost-pinned db:*:local / test:db
      # scripts, which hardcode this password. When CI used a different one,
      # `npm run test:db` overrode DATABASE_URL with the script's value and the
      # probes failed 28P01 against a database that was running fine.
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/pet_shelter?schema=public
      # The specs seal their own admin session cookie, so this must match what
      # the server verifies with. Any value over 32 characters works; it is a
      # throwaway for a throwaway database.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0000
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply the schema and seed the catalogue
        # The golden paths assert on named fixture animals and applicants, so an
        # empty database would fail them for the wrong reason.
        run: |
          npx prisma db push
          npm run db:seed
      - name: Install Chromium
        # The headless shell only: the specs run headless with `devices["Desktop Chrome"]` and no
        # `channel`, which is what the shell serves, so the full Chrome build is never used.
        # Not cached: half of this step is apt packages, which a cache cannot hold, and
        # Playwright's CI guide advises against caching the browsers themselves.
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run the golden paths
        run: npm run test:e2e
      # Every run, not only a red one. CI retries a failed spec once (`retries` in
      # playwright.config.ts), so a flaky spec leaves the job green, and a report kept only on
      # failure would never show it.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # A re-run of this job uploads under the same name, in the same workflow run.
          overwrite: true
