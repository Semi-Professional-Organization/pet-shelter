name: Commit messages

# docs/reference/COMMIT_MESSAGES.md, applied to what a pull request adds.
#
# Its own workflow, rather than a job in ci.yml, so that it also runs when the title is edited.
# The title becomes the squash-merge subject and this is a required check, so a check that ran only
# on pushes would keep judging a title the pull request no longer has: fixing a bad title would
# leave the merge blocked until the next push, and spoiling a good one would go unnoticed. An edit
# reruns these few seconds, not the whole suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job `name` is the required status check "Commit messages" in the repository ruleset
  # "Basic". Renaming it blocks every pull request until the ruleset names it too.
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default shallow clone has no base branch to diff against.
          fetch-depth: 0
          # The audit reads local history only; nothing here needs the token.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # No `npm ci`: the linter is dependency-free Node on purpose, so this job
      # reports in seconds and cannot be broken by an install failure.
      - name: Lint the commits this pull request adds
        # Only the commits this PR adds. The 203 commits that predate
        # docs/reference/COMMIT_MESSAGES.md are grandfathered — re-linting them would
        # fail every run for messages nobody is writing any more.
        #
        # Skipped for pull requests Dependabot opens: its commit bodies quote release notes that
        # cannot meet the 72-column wrap. Its title is the same text as its commit subject, and
        # the next step still checks that.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        # The base branch name goes through the environment for the same reason the title does
        # below: a branch name may contain characters the shell would act on.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/commit-msg.mjs --audit --strict --verbose "origin/$BASE_REF..HEAD"
      # This repository squash-merges, so the commits linted above are discarded,
      # and the subject that reaches master is the pull request title (or, for a
      # one-commit pull request, that commit's subject, which the step above checks).
      # The title was the one message the standard did not govern: e622249 landed
      # on master failing both subject-length and capitalize.
      #
      # The title is untrusted input, so it goes through the environment rather
      # than `run:` interpolation, which would let a crafted title inject shell.
      - name: Lint the pull request title (the squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | node scripts/commit-msg.mjs --stdin
